name: tests
# Runs the full test suite on synthetic data only (no patient data ever reaches CI).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only PyTorch and dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download and verify pinned third-party weights
        run: |
          W=third_party/rsna_knee_kaggle_model/best_model.pth
          curl -sSL -o "$W" https://media.githubusercontent.com/media/SlockAhuja/rsna-knee-mri-model/a254152c1e7cf4aa1d7391cb9260d54a4185118c/best_model.pth
          echo "68bd5d3fd040fa6e4c464d99d2c7dcacaebd2a40388ec0902133d4e26be0f791  $W" | sha256sum -c -
      - name: Tests (regressions + end-to-end smoke test on synthetic DICOM)
        run: python -m pytest -q tests
